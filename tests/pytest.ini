[pytest]
# Cross-cutting tests only (conformance now; e2e/eval later). Package tests stay in their package
# (packages/contract/tests, apps/api/tests) with their own config.
testpaths = conformance
# `contract` is imported from the repo copy unless it is pip-installed (pip install -e packages/contract).
pythonpath = ../packages/contract .
addopts = -ra -p no:cacheprovider
markers =
    live: needs real external services (Nebius/Tavily); never run on fork PRs
    postgres: needs a real PostgreSQL
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
