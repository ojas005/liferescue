[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liferescue-contract"
version = "0.1.0"
description = "LifeRescue platform contract: schemas, state machine, ports, fakes (single runtime)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3", "PyYAML>=6", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "openapi-spec-validator>=0.7", "mypy>=1.10", "types-PyYAML", "types-jsonschema"]

[tool.setuptools]
packages = ["contract", "contract.fakes", "contract.fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
