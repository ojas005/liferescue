# LifeRescue LOCAL development stack (KAN-19 / LR 10).
#
# Scope: local development only. Not a deployment definition: nothing here is for staging or production, and
# no public deployment is approved. See docs/dev/local-development.md.
#
# Services (only what the sprint brief needs today):
#   db  PostgreSQL - the system of record (brief: "PostgreSQL"; doc 18 s1).
# Deliberately NOT included:
#   * Redis / queue / broker : the brief names none; the event bus is a PostgreSQL outbox (ADR-0014 proposal).
#   * api / web containers   : both apps run natively with hot reload (make dev); no Dockerfile exists yet.
#     Add them here as services, behind a compose profile, only when their Dockerfiles land.
#   * observability backend  : local logs go to stdout as JSON (docs: LR10-observability-plan.md).
#
# Usage (from the repository root): make db-up | make dev | make compose-config. Compose reads the root .env
# via --env-file (the Makefile passes it); .env is gitignored and holds local-only values. See .env.example.
name: liferescue

services:
  db:
    # Pinned by tag AND index digest (multi-arch). Tag 18.6-alpine3.24 and its digest were read from the Docker Hub
    # registry API on 2026-10-04. To upgrade: pick a new tag, re-read its digest, update both, run `make db-reset`
    # if the major version changes (data directory layout is major-version specific).
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: liferescue-db
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liferescue}
      # Required: compose refuses to start without it. `make env` generates a random local value in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run `make env` to create .env}
      POSTGRES_DB: ${POSTGRES_DB:-liferescue}
      # Used only by infrastructure/db/initdb/01-create-test-db.sh (runs on first initialisation of the volume).
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-liferescue_test}
    ports:
      # Loopback only: never reachable from other machines on the network. Do not change to 0.0.0.0 or drop the IP.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep PGDATA in a version-specific subdirectory of /var/lib/postgresql, so the volume
      # mounts at /var/lib/postgresql (not /var/lib/postgresql/data as for 17 and older).
      - liferescue_pgdata:/var/lib/postgresql
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ defers expansion to the container shell, where POSTGRES_USER / POSTGRES_DB are set.
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  liferescue_pgdata:
    name: liferescue_pgdata
