# LifeRescue CI - bootstrap baseline.
#
# TARGET pipeline (doc 19 step 9): checkout -> dependency install -> format check -> lint -> type check
#   -> unit tests -> integration tests -> security scan -> secret scan -> build -> artifact.
#
# ACTIVE today (real checks that run on every PR and push to main):
#   - checkout
#   - secret scan (gitleaks, full history)
#   - repository structure validation (scripts/validate-repo-structure.sh)
#   - Markdown relative-link check (scripts/check-markdown-links.py)
#
# CONDITIONAL (jobs run ONLY when matching project files exist; otherwise they are SKIPPED and
# reported as skipped - they do not pass vacuously). None of them has been exercised yet because
# the repository contains no application code:
#   - node-checks    : format, lint, type check, unit, integration (needs package.json + package-lock.json)
#   - python-checks  : format, lint, type check, unit, integration (needs pyproject.toml or requirements*.txt)
#   - dependency-scan: npm audit / pip-audit (needs manifests)
#   - sbom           : CycloneDX SBOM (needs manifests; SBOM tool versions are NOT pinned yet)
#
# ENFORCEMENT jobs added by KAN-20 (LR 10). All fail closed (no `|| true`):
#   - branch-name      : PR branch name rule (scripts/ci_branch_gate.py -> scripts/check-branch-name.py), pull_request only
#   - python-unit-tests: stdlib unittest over scripts/ and tests/security on a Python matrix (separate from python-checks)
#   - pr-link-check    : PLACEHOLDER until scripts/check_pr_link.py (LR 04) exists; see the job comments
#   - ci-gate          : always runs, aggregates every job above; THE check to require in branch protection
#
# NOT IMPLEMENTED: build, artifact, container scan, deployment. No job claims them.
#
# Job `name:` values are STABLE on purpose (no ACTIVE/CONDITIONAL text): required checks are matched by name.
# Whether a job is active or conditional is documented in the comments above, not in the name.
name: CI

on:
  pull_request:
    # `edited` (title/body/base change) is added so the PR-link check re-runs when the PR text is fixed.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs for pull requests only. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1, pinned by commit SHA (verified via GitHub API 2026-10-03)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks v8.30.1 (checksum verified)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan repository history for secrets
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1

  repo-validation:
    name: Repository structure and Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate repository structure
        run: bash scripts/validate-repo-structure.sh
      - name: Check relative Markdown links
        run: python3 scripts/check-markdown-links.py .

  detect:
    name: Detect project files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.d.outputs.node }}
      python: ${{ steps.d.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: d
        run: |
          set -euo pipefail
          node=false; python=false
          if [ -n "$(git ls-files '*package.json' | grep -v node_modules || true)" ]; then node=true; fi
          if [ -n "$(git ls-files '*pyproject.toml' '*requirements*.txt' || true)" ]; then python=true; fi
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          {
            echo "### Conditional stages"
            echo "- Node project files present: $node"
            echo "- Python project files present: $python"
            echo "- Build / artifact / container scan / deploy: NOT IMPLEMENTED"
          } >> "$GITHUB_STEP_SUMMARY"

  node-checks:
    name: Node format/lint/typecheck/tests
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0, pinned by commit SHA (verified via GitHub API 2026-10-03)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
      - name: Install dependencies (requires a lockfile)
        run: npm ci
      - name: Run stages (a missing npm script is reported as SKIPPED, never as passed)
        run: |
          set -uo pipefail
          rc=0
          for s in format:check lint typecheck test test:integration; do
            if node -e "process.exit(((require('./package.json').scripts)||{})['$s']?0:1)"; then
              echo "::group::npm run $s"
              npm run "$s" || rc=1
              echo "::endgroup::"
            else
              echo "::warning::npm script '$s' is not defined - stage SKIPPED"
            fi
          done
          exit $rc

  python-checks:
    name: Python format/lint/typecheck/tests
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0, pinned by commit SHA (verified via GitHub API 2026-10-03)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"
      - name: Install tooling and dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install ruff mypy pytest   # versions unpinned - pin via ADR/lockfile when activated
          for f in requirements*.txt; do [ -f "$f" ] && python -m pip install -r "$f"; done || true
          [ -f pyproject.toml ] && python -m pip install -e . || true
      - name: Format check and lint (ruff)
        run: |
          ruff format --check .
          ruff check .
      - name: Type check (mypy)
        run: mypy .
      - name: Unit tests (pytest)
        run: pytest -m "not integration"
      - name: Integration tests (pytest -m integration; exit code 5 = none collected -> reported as skipped)
        run: |
          set +e
          pytest -m integration
          rc=$?
          if [ $rc -eq 5 ]; then echo "::warning::no integration tests collected - stage SKIPPED"; exit 0; fi
          exit $rc

  dependency-scan:
    name: Dependency scan
    needs: [detect]
    if: needs.detect.outputs.node == 'true' || needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: npm audit
        if: needs.detect.outputs.node == 'true'
        run: npm audit --audit-level=high
      - name: pip-audit
        if: needs.detect.outputs.python == 'true'
        run: |
          python -m pip install pip-audit   # unpinned - pin when activated
          for f in requirements*.txt; do [ -f "$f" ] && pip-audit -r "$f"; done

  sbom:
    name: SBOM (CycloneDX)
    needs: [detect]
    if: needs.detect.outputs.node == 'true' || needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node SBOM
        if: needs.detect.outputs.node == 'true'
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom-node.json
      - name: Python SBOM
        if: needs.detect.outputs.python == 'true'
        run: |
          python -m pip install cyclonedx-bom
          [ -f requirements.txt ] && cyclonedx-py requirements requirements.txt -o sbom-python.json || echo "::warning::no requirements.txt - Python SBOM SKIPPED"
      # actions/upload-artifact v7.0.1, pinned by commit SHA (verified via GitHub API 2026-10-03)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: sbom-*.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------
  # KAN-20 enforcement jobs (LR 10). Every job: explicit least-privilege permissions, timeout,
  # SHA-pinned actions, persist-credentials: false, no secrets, no `|| true`.
  # ---------------------------------------------------------------------------------------------

  branch-name:
    name: Branch name
    # pull_request only: a push to main has no PR head ref. ci-gate expects "skipped" there.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate the PR branch name (invalid name = failure)
        # SECURITY: github.head_ref is attacker-controlled (any user who can open a PR picks it).
        # It is passed ONLY through env, ONLY as BRANCH_NAME, and never interpolated into `run:`.
        # The script never evaluates it and prints it only escaped and length-bounded.
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          # Used only to decide the dependabot/* exemption (login is GitHub-controlled, not user text).
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/ci_branch_gate.py

  python-unit-tests:
    # Stdlib unittest for scripts/ and tests/security. SEPARATE from the dormant `python-checks`
    # job (ruff/mypy/pytest), which stays inactive until pyproject.toml/requirements*.txt exist.
    name: Python unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the documented floor (packages/secrets README: "Requires Python 3.11+"); 3.12-3.14 are the
        # newer stable lines. 3.8-3.10 are not tested: they are not supported by the project.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0, pinned by commit SHA (same pin as the python-checks job)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests - discover scripts/
        run: python3 -W error::ResourceWarning -m unittest discover -v -s scripts -p 'test_*.py'
      - name: Unit tests - named files (a deleted or renamed test file must fail, not silently vanish)
        run: >-
          python3 -W error::ResourceWarning -m unittest -v
          scripts/test_check_branch_name.py
          scripts/test_check_transition.py
          scripts/test_check_pr_link.py
          scripts/test_branch_name_ci_cases.py
          scripts/test_ci_helpers.py
          scripts/test_workflow_guards.py
      - name: Unit tests - tests/security (KAN-45)
        run: |
          set -euo pipefail
          if [ -d tests/security ]; then
            python3 -W error::ResourceWarning -m unittest discover -v -s tests/security
          else
            echo "::notice title=tests/security absent::tests/security does not exist on this ref (KAN-45 not merged yet) - this stage is SKIPPED, not passed."
            echo "tests/security is absent on this ref: stage SKIPPED (not a pass)." >> "$GITHUB_STEP_SUMMARY"
          fi

  pr-link-check:
    name: PR link check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # scripts/check_pr_link.py is delivered by LR 04 (PR #15; contract in docs/pr-jira-link-check.md). It is on
      # main now; this job still keeps a PLACEHOLDER stub for refs that do not contain it (e.g. branches cut before it landed):
      #   * script absent  -> fail-OPEN stub: loud notice + summary line that nothing was checked, then pass.
      #   * script present -> the real check runs; any non-zero exit fails the job.
      # Branches exempted from the naming rule (legacy names, dependabot) carry no Jira key by definition and
      # skip the real check (the script itself fails them on its branch rule and exempts nothing).
      - name: PR link check (PLACEHOLDER stub until scripts/check_pr_link.py exists)
        # SECURITY: title, body and branch are attacker-controlled; they reach the script ONLY through env.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [ ! -e scripts/check_pr_link.py ]; then
            echo "::notice title=PLACEHOLDER::PR link check was NOT performed: scripts/check_pr_link.py does not exist on this ref. This stub passes by design (fail-open)."
            {
              echo "### PR link check - PLACEHOLDER"
              echo "NOT performed: scripts/check_pr_link.py does not exist on this ref. A pass here is NOT evidence that the PR links a Jira issue."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if BRANCH_GATE_MODE=exempt-only python3 scripts/ci_branch_gate.py >/dev/null; then
            echo "::notice title=PR link check skipped::This branch is exempt from the naming rule (legacy or dependabot) and carries no Jira key. Check skipped."
            echo "PR link check SKIPPED: exempt branch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/check_pr_link.py

  ci-gate:
    # The single check to require in branch protection (see PR description). Always runs; fails unless every
    # job below has exactly the result scripts/ci_gate.py expects (skipped counts as a pass ONLY where a job is
    # legitimately not run: PR-only jobs on push, conditional jobs when `detect` found no project files).
    name: CI gate
    if: always()
    needs:
      - secret-scan
      - repo-validation
      - detect
      - node-checks
      - python-checks
      - dependency-scan
      - sbom
      - branch-name
      - python-unit-tests
      - pr-link-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Evaluate needed jobs (fail closed)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_gate.py
