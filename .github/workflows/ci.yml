# LifeRescue CI - bootstrap baseline + KAN-20 enforcement + per-package Python jobs (CI-PERPKG, owner LR 10).
#
# TARGET pipeline (doc 19 step 9): checkout -> dependency install -> format check -> lint -> type check
#   -> unit tests -> integration tests -> security scan -> secret scan -> build -> artifact.
#
# ACTIVE on every PR and push to main:
#   - secret-scan        : gitleaks, full history
#   - repo-validation    : scripts/validate-repo-structure.sh + relative Markdown links
#   - python-unit-tests  : stdlib unittest over scripts/ and tests/security, Python 3.11-3.14
#   - security-corpus    : scripts/ci_corpus_check.py - runs each corpus_selfcheck.py next to ssrf-urls.json /
#                          injection-corpus.json; SKIPPED (notice) while no corpus is on the ref, fails closed once one is
#   - dependency-audit   : pip-audit / npm audit over tracked lock files, REPORT-ONLY (never blocks; LR 08 C1)
#   - branch-name, pr-link-check (pull_request only), ci-gate
#
# PER-PACKAGE (run ONLY when the explicit package path exists; otherwise SKIPPED and ci-gate expects exactly that):
#   - contract-tests : packages/contract - pytest (>= 215 passed), mypy --strict, ruff (correctness rules blocking; full
#                      ruff check + format --check report-only until RUFF_FULL_BLOCKING is flipped), OpenAPI validation
#   - arch-check     : python -m contract.arch_check . from the repo root (rules R1-R6)
# There are NO root-level node/python jobs: adding a pyproject.toml / package.json anywhere does not turn on ruff/mypy/
# pytest/npm at the repository root. New packages get their own job + detect output + ci_gate.py entry (see
# .github/ci/README.md). apps/api and apps/web are NOT covered yet (their scaffolds are pending); `detect` lists such
# project files in the job summary as "not checked by any job". packages/secrets (old name, pending rename) is not
# type-clean in isolation and is only covered by the unittest job above.
#
# Python tooling is hash-locked in .github/ci/*.txt (regenerate per .github/ci/README.md); no job runs an unpinned
# `pip install <name>`, `npx --yes`, or `|| true`.
#
# NOT IMPLEMENTED: build, artifact, container scan, SBOM, deployment. No job claims them.
#
# Job `name:` values are STABLE on purpose (no ACTIVE/CONDITIONAL text). Require ONLY `CI gate` in branch protection.
name: CI

on:
  pull_request:
    # `edited` (title/body/base change) is added so the PR-link check re-runs when the PR text is fixed.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs for pull requests only. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1, pinned by commit SHA (verified via GitHub API 2026-10-03)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks v8.30.1 (checksum verified)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan repository history for secrets
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1

  repo-validation:
    name: Repository structure and Markdown links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate repository structure
        run: bash scripts/validate-repo-structure.sh
      - name: Check relative Markdown links
        run: python3 scripts/check-markdown-links.py .

  detect:
    name: Detect project files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      contract: ${{ steps.d.outputs.contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: d
        # Per-package detection by EXPLICIT path. A pyproject.toml / package.json anywhere else turns nothing on;
        # it is only listed (sanitised, summary only) as a project file that no CI job covers.
        run: |
          set -euo pipefail
          contract=false
          if [ -f packages/contract/pyproject.toml ]; then contract=true; fi
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
          {
            echo "### Per-package CI detection"
            echo "- packages/contract/pyproject.toml present (contract-tests, arch-check run): $contract"
            echo "- Build / artifact / container scan / deploy: NOT IMPLEMENTED"
            echo ""
            echo "Project files that NO CI job checks yet (informational, not a failure):"
            git ls-files -z -- 'pyproject.toml' '*/pyproject.toml' 'package.json' '*/package.json' 'setup.py' '*/setup.py' \
              | tr '\0' '\n' \
              | { grep -v -x -e 'packages/contract/pyproject.toml' || [ $? -eq 1 ]; } \
              | tr -c 'A-Za-z0-9._/\n-' '?' \
              | awk 'NR <= 50 { print "- " substr($0, 1, 200) }'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  # KAN-20 enforcement jobs (LR 10). Every job: explicit least-privilege permissions, timeout,
  # SHA-pinned actions, persist-credentials: false, no secrets, no `|| true`.
  # ---------------------------------------------------------------------------------------------

  branch-name:
    name: Branch name
    # pull_request only: a push to main has no PR head ref. ci-gate expects "skipped" there.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate the PR branch name (invalid name = failure)
        # SECURITY: github.head_ref is attacker-controlled (any user who can open a PR picks it).
        # It is passed ONLY through env, ONLY as BRANCH_NAME, and never interpolated into `run:`.
        # The script never evaluates it and prints it only escaped and length-bounded.
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          # Used only to decide the dependabot/* exemption (login is GitHub-controlled, not user text).
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/ci_branch_gate.py

  python-unit-tests:
    # Stdlib unittest for scripts/ and tests/security (packages/secrets is covered here, not by a per-package job).
    name: Python unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the documented floor (packages/secrets README: "Requires Python 3.11+"); 3.12-3.14 are the
        # newer stable lines. 3.8-3.10 are not tested: they are not supported by the project.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0, pinned by commit SHA (same pin as the per-package jobs)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests - discover scripts/
        run: python3 -W error::ResourceWarning -m unittest discover -v -s scripts -p 'test_*.py'
      - name: Unit tests - named files (a deleted or renamed test file must fail, not silently vanish)
        run: >-
          python3 -W error::ResourceWarning -m unittest -v
          scripts/test_check_branch_name.py
          scripts/test_check_transition.py
          scripts/test_check_pr_link.py
          scripts/test_branch_name_ci_cases.py
          scripts/test_ci_helpers.py
          scripts/test_workflow_guards.py
      - name: Unit tests - tests/security (KAN-45)
        run: |
          set -euo pipefail
          if [ -d tests/security ]; then
            python3 -W error::ResourceWarning -m unittest discover -v -s tests/security
          else
            echo "::notice title=tests/security absent::tests/security does not exist on this ref (KAN-45 not merged yet) - this stage is SKIPPED, not passed."
            echo "tests/security is absent on this ref: stage SKIPPED (not a pass)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------------------------
  # Per-package Python jobs (LR 10, CI-PERPKG). Each job is bound to ONE explicit package path; adding a
  # pyproject.toml / package.json elsewhere does NOT enable any root-level ruff/mypy/pytest run.
  # Python deps come from hash-locked files (.github/ci/*.txt, regenerate per .github/ci/README.md):
  # `pip install --require-hashes --no-deps`, no unpinned `pip install <name>`, no `|| true`.
  # ---------------------------------------------------------------------------------------------

  contract-tests:
    # packages/contract (PR #18). Runs only when packages/contract/pyproject.toml exists (detect); ci-gate then
    # REQUIRES success (skipped when absent is the only other accepted outcome).
    name: Contract package (${{ matrix.python-version }})
    needs: detect
    if: needs.detect.outputs.contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # requires-python >= 3.11 in packages/contract/pyproject.toml; same lines as python-unit-tests
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # Floor, not an exact count: tests may be added, silently losing them fails (PR #18 ships 215).
      MIN_CONTRACT_TESTS: "215"
      # Flip to "true" once LR 03 has formatted packages/contract (ruff format + ruff check --fix) to make the
      # full ruff check and `ruff format --check` blocking. Until then they are reported (summary + warning) only.
      RUFF_FULL_BLOCKING: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0, pinned by commit SHA (same pin as python-unit-tests)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies (hash-checked) and the package
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes --no-deps -r .github/ci/contract-requirements.txt
          python3 -m pip install --no-deps --no-build-isolation -e packages/contract
          python3 -m pip check
      - name: Tests (pytest, JUnit report)
        working-directory: packages/contract
        run: python3 -W error::ResourceWarning -m pytest -q --junitxml="$RUNNER_TEMP/contract-junit.xml"
      - name: Tests - the number of passed tests must not drop below the floor
        run: python3 scripts/ci_check_junit.py "$RUNNER_TEMP/contract-junit.xml" "$MIN_CONTRACT_TESTS"
      - name: Type check (mypy --strict)
        working-directory: packages/contract
        run: python3 -m mypy --strict contract
      - name: Lint - correctness rules (ruff, blocking)
        # --isolated: fixed rule set (syntax errors, undefined names, invalid constructs), independent of package config.
        working-directory: packages/contract
        run: python3 -m ruff check --isolated --no-cache --select E9,F63,F7,F82 .
      - name: Lint and format - full check (ruff; blocking only when RUFF_FULL_BLOCKING is "true")
        # Uses the package's own [tool.ruff] config if LR 03 adds one. packages/contract is not ruff-clean today
        # (see .github/ci/README.md), so findings are reported, not enforced, until RUFF_FULL_BLOCKING is flipped.
        working-directory: packages/contract
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          set -uo pipefail
          status=ok
          python3 -m ruff check --no-cache --no-fix --output-format concise . || status=findings
          python3 -m ruff format --check --no-cache --output-format concise . || status=findings
          if [ "$status" = ok ]; then
            echo "ruff check and ruff format --check are clean."
            echo "ruff (full): clean" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RUFF_FULL_BLOCKING" = "true" ]; then
            echo "::error title=ruff::ruff check / format --check reported findings (blocking)"
            exit 1
          else
            echo "::warning title=ruff (report-only)::ruff check / format --check reported findings in packages/contract; not blocking yet"
            echo "ruff (full): findings, REPORT-ONLY (python $PY_VERSION)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: OpenAPI validation (openapi-spec-validator)
        working-directory: packages/contract
        run: python3 -m openapi_spec_validator openapi.yaml

  arch-check:
    # ONE-runtime import rules R1-R6 over the whole repository (LR 07 / LR 03 daily checklist item 1).
    name: Architecture check (contract.arch_check)
    needs: detect
    if: needs.detect.outputs.contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install locked dependencies (hash-checked) and the package
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes --no-deps -r .github/ci/contract-requirements.txt
          python3 -m pip install --no-deps --no-build-isolation -e packages/contract
      - name: arch_check from the repository root (exit 1 on any violation)
        run: python3 -m contract.arch_check .

  security-corpus:
    # LR 07 / LR 08 (S7 SSRF, U8 injection): corpus self-consistency only, see scripts/ci_corpus_check.py.
    # Always runs; reports SKIPPED (a notice, not a pass claim) while no corpus file is on the ref; once a corpus
    # directory exists it fails closed (missing self-check or non-zero exit). Product-level SSRF/injection tests
    # are NOT run here (they do not exist on main yet).
    name: Security corpus consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Corpus self-checks
        run: python3 scripts/ci_corpus_check.py .

  dependency-audit:
    # REPORT-ONLY (LR 08 C1): findings are logged and summarised, never block. ci-gate accepts any result of this job.
    name: Dependency audit (report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install pip-audit (hash-locked)
        run: python3 -m pip install --require-hashes --no-deps -r .github/ci/audit-requirements.txt
      - name: Locate lock files
        id: locks
        run: |
          set -euo pipefail
          py=$(git ls-files -z -- '*requirements*.txt' | tr -cd '\0' | wc -c)
          npm=$(git ls-files -z -- '*package-lock.json' | tr -cd '\0' | wc -c)
          echo "python=$py" >> "$GITHUB_OUTPUT"
          echo "npm=$npm" >> "$GITHUB_OUTPUT"
      - name: pip-audit over every tracked requirements*.txt (report-only; none present is fine)
        env:
          PY_LOCKS: ${{ steps.locks.outputs.python }}
        run: |
          set -uo pipefail
          if [ "$PY_LOCKS" = "0" ]; then
            echo "::notice title=pip-audit::no requirements*.txt tracked - nothing to audit"
            echo "pip-audit: nothing to audit (no requirements*.txt)" >> "$GITHUB_STEP_SUMMARY"
          fi
          git ls-files -z -- '*requirements*.txt' | while IFS= read -r -d '' f; do
            echo "::group::pip-audit $f"
            if python3 -m pip_audit --no-deps --disable-pip -r "$f"; then
              echo "pip-audit: $f clean" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=pip-audit (report-only)::findings or an audit error for a requirements file; see the log"
              echo "pip-audit: $f REPORTED findings or an error (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
      # actions/setup-node v7.0.0, pinned by commit SHA (verified via GitHub API 2026-10-03)
      - name: Set up Node.js (only when a package-lock.json is tracked)
        if: steps.locks.outputs.npm != '0'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: npm audit over every tracked package-lock.json (report-only)
        if: steps.locks.outputs.npm != '0'
        run: |
          set -uo pipefail
          git ls-files -z -- '*package-lock.json' | while IFS= read -r -d '' f; do
            echo "::group::npm audit $f"
            if (cd "$(dirname "$f")" && npm audit --package-lock-only --audit-level=high); then
              echo "npm audit: $f clean" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=npm audit (report-only)::findings or an audit error for a lock file; see the log"
              echo "npm audit: $f REPORTED findings or an error (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done

  pr-link-check:
    name: PR link check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # scripts/check_pr_link.py is delivered by LR 04 (PR #15; contract in docs/pr-jira-link-check.md). It is on
      # main now; this job still keeps a PLACEHOLDER stub for refs that do not contain it (e.g. branches cut before it landed):
      #   * script absent  -> fail-OPEN stub: loud notice + summary line that nothing was checked, then pass.
      #   * script present -> the real check runs; any non-zero exit fails the job.
      # Branches exempted from the naming rule (legacy names, dependabot) carry no Jira key by definition and
      # skip the real check (the script itself fails them on its branch rule and exempts nothing).
      - name: PR link check (PLACEHOLDER stub until scripts/check_pr_link.py exists)
        # SECURITY: title, body and branch are attacker-controlled; they reach the script ONLY through env.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [ ! -e scripts/check_pr_link.py ]; then
            echo "::notice title=PLACEHOLDER::PR link check was NOT performed: scripts/check_pr_link.py does not exist on this ref. This stub passes by design (fail-open)."
            {
              echo "### PR link check - PLACEHOLDER"
              echo "NOT performed: scripts/check_pr_link.py does not exist on this ref. A pass here is NOT evidence that the PR links a Jira issue."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if BRANCH_GATE_MODE=exempt-only python3 scripts/ci_branch_gate.py >/dev/null; then
            echo "::notice title=PR link check skipped::This branch is exempt from the naming rule (legacy or dependabot) and carries no Jira key. Check skipped."
            echo "PR link check SKIPPED: exempt branch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/check_pr_link.py

  ci-gate:
    # The single check to require in branch protection (see PR description). Always runs; fails unless every
    # job below has exactly the result scripts/ci_gate.py expects (skipped counts as a pass ONLY where a job is
    # legitimately not run: PR-only jobs on push, conditional jobs when `detect` found no project files).
    name: CI gate
    if: always()
    needs:
      - secret-scan
      - repo-validation
      - detect
      - contract-tests
      - arch-check
      - security-corpus
      - dependency-audit
      - branch-name
      - python-unit-tests
      - pr-link-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Evaluate needed jobs (fail closed)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_gate.py
